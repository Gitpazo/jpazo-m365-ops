name: Validate public safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validation modules
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 5.0.0
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Filter *.ps1 -Path scripts, templates, tests
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) {
              $errors | ForEach-Object { Write-Error "$($file.FullName): $($_.Message)" }
              exit 1
            }
          }

      - name: Analyze PowerShell scripts
        shell: pwsh
        run: |
          $findings = @('scripts', 'templates') |
            Where-Object { Test-Path $_ } |
            ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Recurse -Severity Error }
          if ($findings) {
            $findings | Format-Table -AutoSize | Out-String | Write-Error
            exit 1
          }

      - name: Run public-safety tests
        shell: pwsh
        run: Invoke-Pester ./tests -Output Detailed
